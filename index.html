<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOUL DUST MOVIES</title>

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="logo">SOUL DUST</div>

        <nav>
            <a href="#">Home</a>
            <a href="#movies">Movies</a>
            <a href="#tv">Live TV</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <h1>Unlimited Movies & Entertainment</h1>
            <p>Watch trending movies and South African live TV.</p>

            <button onclick="scrollToMovies()" class="hero-btn">
                ▶ Watch Now
            </button>
        </div>
    </section>

    <section class="live-tv" id="tv">
        <div class="section-header">
            <h2>📺 Live TV</h2>
        </div>

        <div class="channels">
            <button onclick="playLive('sabc1')">SABC 1</button>
            <button onclick="playLive('sabc2')">SABC 2</button>
            <button onclick="playLive('sabc3')">SABC 3</button>
            <button onclick="playLive('e.tv')">eTV</button>
        </div>
    </section>

    <section class="movies" id="movies">
        <div class="section-header">
            <h2>🔥 Trending Movies</h2>
        </div>

        <div id="movie-display"></div>
    </section>

    <div id="player-zone"></div>

    <script src="script.js"></script>
</body>
</html>
