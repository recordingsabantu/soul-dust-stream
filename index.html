<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SOUL DUST MOVIES</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#0d0d0d;
            color:white;
        }

        header{
            background:#111;
            padding:20px;
            text-align:center;
            border-bottom:2px solid #ff0000;
        }

        header h1{
            color:#ff0000;
            font-size:2rem;
        }

        .live-tv{
            padding:20px;
        }

        .live-tv h2{
            margin-bottom:15px;
        }

        .channels{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }

        .channels button{
            padding:12px 20px;
            border:none;
            background:#ff0000;
            color:white;
            cursor:pointer;
            border-radius:8px;
            font-weight:bold;
        }

        .channels button:hover{
            background:#cc0000;
        }

        .movies{
            padding:20px;
        }

        .movies h2{
            margin-bottom:20px;
        }

        #movie-display{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
            gap:20px;
        }

        .movie-card{
            background:#1a1a1a;
            border-radius:12px;
            overflow:hidden;
            cursor:pointer;
            transition:0.3s;
        }

        .movie-card:hover{
            transform:scale(1.05);
        }

        .movie-card img{
            width:100%;
            height:270px;
            object-fit:cover;
        }

        .card-info{
            padding:10px;
        }

        .card-info h4{
            font-size:16px;
            margin-bottom:5px;
        }

        .card-info p{
            color:#999;
        }

        #player-zone{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.9);
            display:none;
            justify-content:center;
            align-items:center;
            z-index:999;
        }

        .video-wrapper{
            width:90%;
            max-width:1000px;
            position:relative;
        }

        .video-wrapper iframe{
            width:100%;
            height:550px;
            border:none;
            border-radius:10px;
        }

        .close-btn{
            position:absolute;
            top:-45px;
            right:0;
            padding:10px 18px;
            border:none;
            background:red;
            color:white;
            cursor:pointer;
            font-weight:bold;
            border-radius:6px;
        }

        @media(max-width:768px){
            .video-wrapper iframe{
                height:300px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 SOULDUST MOVIES & LIVE TV</h1>
    </header>

    <!-- LIVE TV -->
    <section class="live-tv">
        <h2>📺 South African Live TV</h2>

        <div class="channels">
            <button onclick="playLive('sabc1')">SABC 1</button>
            <button onclick="playLive('sabc2')">SABC 2</button>
            <button onclick="playLive('sabc3')">SABC 3</button>
            <button onclick="playLive('e.tv')">eTV</button>
        </div>
    </section>

    <!-- TRENDING MOVIES -->
    <section class="movies">
        <h2>🔥 Trending Movies</h2>

        <div id="movie-display"></div>
    </section>

    <!-- VIDEO PLAYER -->
    <div id="player-zone"></div>

    <script>
        const TMDB_KEY = 'b50c94712e233654a22d62f77f7384b3';

        // 1. FETCH TRENDING MOVIES AUTOMATICALLY
        async function getTrending() {
            try {
                const response = await fetch(
                    `https://api.themoviedb.org/3/trending/movie/week?api_key=${TMDB_KEY}`
                );

                const data = await response.json();

                const display = document.getElementById('movie-display');

                display.innerHTML = data.results.map(movie => `
                    <div class="movie-card" onclick="streamMovie('${movie.id}')">
                        <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${movie.title}">
                        
                        <div class="card-info">
                            <h4>${movie.title}</h4>
                            <p>${movie.release_date ? movie.release_date.split('-')[0] : 'N/A'}</p>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error("Error fetching movies:", error);
            }
        }

        // 2. STREAM MOVIES
        function streamMovie(id) {

            const playerContainer = document.getElementById('player-zone');

            playerContainer.innerHTML = `
                <div class="video-wrapper">
                    <button onclick="closePlayer()" class="close-btn">
                        X CLOSE
                    </button>

                    <iframe 
                        src="https://vidsrc.to/embed/movie/${id}" 
                        allowfullscreen>
                    </iframe>
                </div>
            `;

            playerContainer.style.display = 'flex';
        }

        // 3. LIVE TV
        function playLive(channel) {

            let streamUrl = "";

            if(channel === 'sabc1')
                streamUrl = "https://sabc-plus.com/live/320/SABC-1";

            if(channel === 'sabc2')
                streamUrl = "https://sabc-plus.com/live/321/SABC-2";

            if(channel === 'sabc3')
                streamUrl = "https://sabc-plus.com/live/322/S3";

            if(channel === 'e.tv')
                streamUrl = "https://watch.evod.co.za/live-tv/etv/live_533134591782";

            const playerContainer = document.getElementById('player-zone');

            playerContainer.innerHTML = `
                <div class="video-wrapper">

                    <button onclick="closePlayer()" class="close-btn">
                        X CLOSE
                    </button>

                    <iframe 
                        src="${streamUrl}" 
                        allowfullscreen>
                    </iframe>

                </div>
            `;

            playerContainer.style.display = 'flex';
        }

        // CLOSE PLAYER
        function closePlayer() {
            document.getElementById('player-zone').style.display = 'none';
            document.getElementById('player-zone').innerHTML = '';
        }

        // RUN ON LOAD
        window.onload = getTrending;
    </script>

</body>
</html>
